{% extends "base.html" %}

{% block title %}Page Not Found (404) — FindIt{% endblock %}

{% block content %}
<div class="error-page-container">
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Report or Page Not Found</h1>
    <p class="error-desc">
      We couldn't find the item or page you were looking for. It might have been removed or the URL could be mistyped.
    </p>
    <div class="error-actions">
      <a href="{{ url_for('index') }}" class="btn btn-primary" id="btn-404-home">Back to Homepage</a>
      <a href="{{ url_for('browse_items') }}" class="btn btn-outline" id="btn-404-browse">Browse Reports</a>
    </div>
  </div>
</div>
{% endblock %}
